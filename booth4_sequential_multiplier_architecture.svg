<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:20px;font-weight:400;text-anchor:start;dominant-baseline:auto">alu_8bit_top gains clk, rst_n, start, and done. Inside it, alu_mult wraps a sequential booth4 core containing a control FSM, M/Q/AC registers, a booth4 encoder, and the reused add_sub adder. Other ALU operations stay combinational.</desc>
